<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arches 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3d9c8; }
  canvas { display: block; cursor: pointer; }
  #debug {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,.55); color: #fff; padding: 10px; border-radius: 8px;
    font: 12px/1.5 ui-monospace, Menlo, monospace; min-width: 230px;
  }
  #debug canvas { display: block; width: 160px; height: 120px; margin-bottom: 6px; transform: scaleX(-1); cursor: default; }
  #debug .row { display: flex; align-items: center; gap: 6px; }
  #debug .row span:first-child { flex: 1; }
  #debug button { font: inherit; min-width: 26px; padding: 1px 6px; cursor: pointer; }
  #debug .btns { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
</style>
<script>
  // With ?debug, show load errors on screen (they happen before main.js can draw its own overlay)
  if (location.search.includes('debug')) {
    const show = msg => {
      const el = document.createElement('pre');
      el.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;z-index:20;background:#300;color:#fff;padding:8px;white-space:pre-wrap;font:12px monospace';
      el.textContent = 'error: ' + msg;
      document.body.appendChild(el);
    };
    addEventListener('error', e => show(e.message + (e.filename ? `  (${e.filename.split('/').pop()}:${e.lineno})` : '')));
    addEventListener('unhandledrejection', e => show(String(e.reason)));
  }
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module" src="main.js?v=7"></script>
</body>
</html>
